# ==============================================================================
# Render Blueprint Specification for Settle Core (System 1)
# ==============================================================================

services:
  - type: web
    name: settle-api
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: settle-db
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: "0.0.0.0"
      - key: PAYPAL_BASE_URL
        value: https://api-m.sandbox.paypal.com
      - key: WEBHOOK_VERIFY
        value: "true"
      - key: POLICY_IGNORE_QUIET_HOURS
        value: "true"
      - key: ENGINE_IMPL
        value: real
      - key: AGENT_IMPL
        value: stub
      - key: DEMO_TODAY
        value: "2026-11-05"
      - key: DEMO_BUYER_INVOICE_IDS
        value: inv_001,inv_002
      - key: AUTO_PROVISION_PAYPAL
        value: "false"
      - key: PAYPAL_NUMBER_SUFFIX
        value: "true"
      - key: WEB_ORIGIN
        value: "*"
      # Secret variables - must be entered manually in Render dashboard
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_BUYER_EMAIL
        sync: false
      - key: PAYPAL_BUYER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false

databases:
  - name: settle-db
    plan: free
    region: oregon
    databaseName: settle
    user: settle

